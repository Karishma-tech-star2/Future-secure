<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Future Secure</title>
    <link rel="stylesheet" href="signup.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <main class="signup-page">
        <div class="signup-card">
            <!-- Logo -->
            <a href="index.html" class="signup-logo">
                <img src="logo1.png" alt="Future Secure Logo">
            </a>

            <!-- Heading -->
            <div class="signup-head">
                <div>GET STARTED</div>
                <h1>Create Your Account</h1>
                <p>
                    Create an account to start planning your child's future.
                </p>
            </div>

            <!-- Form -->
            <form id="signup-form">
                <!-- Name -->
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Enter your full name">
                    <small class="error-message" id="name-error"></small>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="Enter your email">
                    <small class="error-message" id="email-error"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="password-box">
                        <input type="password" id="signup-password" placeholder="Create a password">
                        <button type="button" class="toggle-password" id="toggle-password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small class="error-message" id="password-error"></small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="password-box">
                        <input type="password" id="confirm-password" placeholder="Re-enter your password">
                        <button type="button" class="toggle-password" id="toggle-confirm-password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <small class="error-message" id="confirm-password-error"></small>
                </div>
                <button type="submit" class="signup-submit">
                    Create Account
                </button>
            </form>

            <!-- Login Link -->
            <div class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </div>
            
        </div>
    </main>
    <script src="signup.js"></script>
</body>
</html>
